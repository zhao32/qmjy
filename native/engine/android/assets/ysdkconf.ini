;**************游戏相关配置, 游戏需要根据各自情况修改 START **********
;必填, 游戏的QQAPPID, 开发者在open平台上配置的qqAppId（同游戏首页APPID）
QQ_APP_ID=

;必填, 游戏的OFFER_ID, 与QQ_APP_ID一致（同游戏首页APPID）
OFFER_ID=

;游戏的微信APPID
WX_APP_ID=
;***************游戏相关配置, 游戏需要根据各自情况修改 END **************


;************* YSDK相关配置项, 游戏需要根据各自情况修改 START **********
;必填, 联调环境, YSDK接入的网络类型
;YSDK_URL=https://ysdktest.qq.com
YSDK_URL=https://ysdk.qq.com
;************** YSDK相关配置项, 游戏需要根据各自情况修改 END **************


;YSDK 游戏内Icon开关
YSDK_ICON_SWITCH=true

;YSDK 游戏内WebView Debug开关

;YSDK 游戏内Icon截图按钮展示开关
YSDK_ICON_CAPTURE_SWITCH=false

;YSDK 游戏内Icon位置单位dp
YSDK_ICON_LOCATION=100

;YSDK 游戏内场景
YSDK_IMMERSIVE_ICON_SWITCH=true

;YSDK H5游戏支持模式
YSDK_H5GAME_SWITCH=false

;YSDK 防沉迷开关
YSDK_ANTIADDICTION_SWITCH=true

;YSDK 防沉迷弹窗
YSDK_ANTIADDICTION_DIALOG_SWITCH=true